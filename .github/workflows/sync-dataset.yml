name: sync-dataset

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest dataset
        run: |
          curl -fsSL https://raw.githubusercontent.com/sin0317/htlb-dataset/main/data/htlb.json   -o data/htlb.json
          curl -fsSL https://raw.githubusercontent.com/sin0317/htlb-dataset/main/data/stats.json  -o data/stats.json
          curl -fsSL https://raw.githubusercontent.com/sin0317/htlb-dataset/main/data/schema.json -o data/schema.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "sync dataset $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
